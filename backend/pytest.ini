[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
markers =
    property: Hypothesis-driven property-based tests (design.md §Catalog P1–P10)
    integration: Integration tests that exercise the orchestrator path with FakeClaudeClient
filterwarnings =
    ignore::DeprecationWarning
